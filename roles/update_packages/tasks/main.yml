---
- name: Get Hostnames
  ansible.builtin.debug:
    msg: "{{ ansible_hostname }}:{{ ansible_default_ipv4.address }}"

- name: Default the reboot-required flag to false
  ansible.builtin.set_fact:
    update_packages_reboot_required: false

- name: Update packages for this OS family
  ansible.builtin.include_tasks: "{{ update_packages_family_tasks[ansible_os_family] }}"
  when: ansible_os_family in update_packages_family_tasks

- name: Reboot the system if required
  become: true
  ansible.builtin.reboot:
    msg: "Rebooting the system because a package update requires it"
    reboot_timeout: 600
  when: update_packages_reboot_required
