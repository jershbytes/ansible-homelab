name: release-collection

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches galaxy version
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          GALAXY_VERSION=$(grep -E '^version:' galaxy.yml | awk '{print $2}')
          EXPECTED_TAG="v${GALAXY_VERSION}"

          if [[ -z "$GALAXY_VERSION" ]]; then
            echo "Could not read version from galaxy.yml"
            exit 1
          fi

          if [[ "$TAG_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Tag/version mismatch"
            echo "Tag: $TAG_NAME"
            echo "galaxy.yml version: $GALAXY_VERSION"
            echo "Expected tag: $EXPECTED_TAG"
            exit 1
          fi

          echo "Tag matches galaxy.yml version: $TAG_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ansible.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint
        run: ansible-lint

      - name: Build collection
        run: |
          mkdir -p dist
          ansible-galaxy collection build --output-path dist --force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
