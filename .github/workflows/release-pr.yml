name: prepare-release-pr

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no v prefix), e.g. 0.2.0"
        required: true
        type: string
      release_summary:
        description: "Short changelog summary for this release"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version input
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semver without v prefix, like 0.2.0"
            exit 1
          fi

      - name: Update galaxy and changelog
        env:
          NEW_VERSION: ${{ inputs.version }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["NEW_VERSION"].strip()
          summary = os.environ["RELEASE_SUMMARY"].strip()

          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+$", version):
              raise SystemExit("Invalid version format. Use semver like 0.2.0")
          if not summary:
              raise SystemExit("release_summary input cannot be empty")

          galaxy_path = Path("galaxy.yml")
          galaxy_text = galaxy_path.read_text(encoding="utf-8")
          updated_galaxy = re.sub(
              r"(?m)^version:\s*.*$",
              f"version: {version}",
              galaxy_text,
              count=1,
          )
          if updated_galaxy == galaxy_text:
              raise SystemExit("Could not find version field in galaxy.yml")
          galaxy_path.write_text(updated_galaxy, encoding="utf-8")

          changelog_path = Path("changelogs/changelog.yaml")
          changelog_text = changelog_path.read_text(encoding="utf-8")

          if re.search(rf"(?m)^  {re.escape(version)}:\s*$", changelog_text):
              raise SystemExit(f"Version {version} already exists in changelog")

          if "releases:\n" not in changelog_text:
              raise SystemExit("Could not find releases: root in changelog")

          release_date = datetime.date.today().isoformat()
          block = (
              f"  {version}:\n"
              f"    release_date: \"{release_date}\"\n"
              "    changes:\n"
              f"      release_summary: {json.dumps(summary)}\n"
          )

          updated_changelog = changelog_text.replace("releases:\n", f"releases:\n{block}", 1)
          changelog_path.write_text(updated_changelog, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ansible.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint
        run: ansible-lint

      - name: Build collection
        run: |
          mkdir -p dist
          ansible-galaxy collection build --output-path dist --force

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(release): prepare v${{ inputs.version }}"
          branch: "release/v${{ inputs.version }}"
          delete-branch: true
          title: "chore(release): prepare v${{ inputs.version }}"
          body: |
            Automated release preparation.

            Changes in this PR:
            - Bump collection version in galaxy.yml to ${{ inputs.version }}
            - Add changelog entry for ${{ inputs.version }}

            Release summary:
            - ${{ inputs.release_summary }}
          labels: |
            release
            automation
